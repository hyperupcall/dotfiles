allowBuilds:
  pnpm: true
  unrs-resolver: true
publicHoistPattern:
  - prettier
  - eslint
  - eslint-plugin-unicorn
  - '@commitlint/cli'
overrides:
  'eslint-plugin-unicorn': 'npm:eslint-plugin-unicorn@69.0.0'
minimumReleaseAgeExclude:
  - eslint-plugin-unicorn@69.0.0
  - '@hyperupcall/eslint-config@2.1.0'
  - '@hyperupcall/scripts-nodejs@0.17.0'
  - '@hyperupcall/markdownlint-config@0.5.2'
  - '@hyperupcall/npm-package-json-lint-config@0.2.0'
