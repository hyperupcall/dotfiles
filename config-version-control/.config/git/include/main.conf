[advice]
	addEmptyPathspec = false
[core]
	warnAmbiguousRefs = true ; default
	; pager = ; See ./diff.conf
[init]
	defaultBranch = main
[add "interactive"]
	useBuiltIn = true
[blame]
	coloring = highlightRecent
	date = relative
[apply]
	whitespace = warn
[branch]
	autoSetupMerge = true
[checkout]
	defaultRemote = me
[clone]
	defaultRemoteName = me
[clean]
	requireForce = true ; default
[color "blame"]
	highlightRecent = magenta,2 year ago,red,12 month ago,yellow,6 month ago,green,1 month ago,cyan
[color]
	diff = auto
	status = auto
	branch = auto
	pager = true ; default
[color "push"]
	error = magenta
[color "transport"]
	rejected = magenta
[color]
	ui = true
[commit]
	gpgSign = true
	template = ~/.home/xdg_config_dir/git/templates/commit
[include]
	path = include/diff.conf
[filter "lfs"]
	clean = git-lfs clean -- %f
	smudge = git-lfs smudge -- %f
	process = git-lfs filter-process
	required = true
[gpg]
	; program = gpg ; default
	format = openpgp ; default
[help]
	autoCorrect = 20
[merge]
	; conflictstyle = ; See ./diff.conf
	ff = true ; default
[pull]
	ff = true ; default
	rebase = false
[push]
	default = simple ; default
	followTags = true
[rerere]
	enabled = true
[rebase]
	stat = true
[status]
	showStash = true
	showUntrackedFiles = all
	submoduleSummary = true
[tag]
	forceSignAnnotated = true
	gpgSign = true
[user]
	name = Edwin Kofler
	email = edwin@kofler.dev
	signingkey = 0x650E7B05E22F31C5
[credential]
	credentialStore = secretservice
