title: 'Dotfiles'
description: 'Personal dotfiles and configuration management'
baseurl: ''
url: ''

markdown: kramdown
theme: minima
permalink: /:basename:output_ext

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-relative-links
  - jekyll-optional-front-matter

kramdown:
  input: GFM
  syntax_highlighter: rouge

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .bundle/
